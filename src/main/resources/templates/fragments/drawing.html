<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<!--
  Static sample of the top-view (set fra oven) drawing for a 600 x 780 cm carport.
  Replace with the SVG generated by the drawing service; the structure below is the
  target output: outline, 2 remme, 14 spær, 6 stolper, 2 hulbånd and dimension lines.
  1 SVG unit = 1 cm, offset by 60 units for the dimension lines.
-->
<body>

<svg th:fragment="top(width, length)" class="drawing-top" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 740" role="img" aria-label="Carport set fra oven">
    <defs>
        <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0 0 L10 5 L0 10 z" fill="#1b2230"/>
        </marker>
        <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M10 0 L0 5 L10 10 z" fill="#1b2230"/>
        </marker>
    </defs>

    <!-- Outline of the roof -->
    <rect class="outline" x="60" y="60" width="780" height="600"/>

    <!-- Spær (14 stk, 45 mm wide, evenly spaced) -->
    <g class="wood">
        <rect x="60"     y="60" width="4.5" height="600"/>
        <rect x="119.65" y="60" width="4.5" height="600"/>
        <rect x="179.3"  y="60" width="4.5" height="600"/>
        <rect x="238.95" y="60" width="4.5" height="600"/>
        <rect x="298.6"  y="60" width="4.5" height="600"/>
        <rect x="358.25" y="60" width="4.5" height="600"/>
        <rect x="417.9"  y="60" width="4.5" height="600"/>
        <rect x="477.55" y="60" width="4.5" height="600"/>
        <rect x="537.2"  y="60" width="4.5" height="600"/>
        <rect x="596.85" y="60" width="4.5" height="600"/>
        <rect x="656.5"  y="60" width="4.5" height="600"/>
        <rect x="716.15" y="60" width="4.5" height="600"/>
        <rect x="775.8"  y="60" width="4.5" height="600"/>
        <rect x="835.5"  y="60" width="4.5" height="600"/>
    </g>

    <!-- Remme (2 rows, 35 cm inside the roof edge) -->
    <g class="wood">
        <rect x="60" y="95"    width="780" height="4.5"/>
        <rect x="60" y="620.5" width="780" height="4.5"/>
    </g>

    <!-- Hulbånd (steel strap cross) -->
    <line class="strap" x1="124" y1="100" x2="776" y2="620"/>
    <line class="strap" x1="124" y1="620" x2="776" y2="100"/>

    <!-- Stolper (97 x 97 mm), 3 per side -->
    <g class="post">
        <rect x="155.2" y="92.4"  width="9.7" height="9.7"/>
        <rect x="445.2" y="92.4"  width="9.7" height="9.7"/>
        <rect x="735.2" y="92.4"  width="9.7" height="9.7"/>
        <rect x="155.2" y="617.9" width="9.7" height="9.7"/>
        <rect x="445.2" y="617.9" width="9.7" height="9.7"/>
        <rect x="735.2" y="617.9" width="9.7" height="9.7"/>
    </g>

    <!-- Dimension: length (top) -->
    <line class="dim-line" x1="60" y1="30" x2="840" y2="30" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="60" y1="20" x2="60" y2="58"/>
    <line class="dim-line" x1="840" y1="20" x2="840" y2="58"/>
    <rect x="410" y="12" width="80" height="34" fill="#fff"/>
    <text class="dim-text" x="450" y="38" text-anchor="middle" th:text="${length} + ' cm'">780 cm</text>

    <!-- Dimension: width (left) -->
    <line class="dim-line" x1="30" y1="60" x2="30" y2="660" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="20" y1="60" x2="58" y2="60"/>
    <line class="dim-line" x1="20" y1="660" x2="58" y2="660"/>
    <rect x="14" y="320" width="34" height="80" fill="#fff"/>
    <text class="dim-text" x="36" y="360" text-anchor="middle" transform="rotate(-90 36 360)" th:text="${width} + ' cm'">600 cm</text>

    <!-- Dimension: spacing between spær (bottom) -->
    <line class="dim-line" x1="60" y1="700" x2="119.65" y2="700" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
    <line class="dim-line" x1="60" y1="690" x2="60" y2="710"/>
    <line class="dim-line" x1="119.65" y1="690" x2="119.65" y2="710"/>
    <text class="dim-text" x="90" y="732" text-anchor="middle" style="font-size:18px">59,7 cm</text>
    <text class="dim-text" x="840" y="705" text-anchor="end" style="font-size:18px; fill:#5b6676">Spær c/c · Set fra oven</text>
</svg>

</body>
</html>
